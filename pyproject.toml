[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cytos"
version = "0.1.0"
description = "Tree Tensor Networks vs Graph Neural Networks for graph-structured temporal dynamics, with an entanglement-inspired interpretability pilot."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "GB"}]
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torch_geometric",
    "networkx",
    "numpy",
    "scipy",
    "python-louvain",
    "scikit-learn",
]

[project.optional-dependencies]
dream4 = ["pandas"]
dataframe = ["pandas"]

[tool.setuptools.packages.find]
include = ["cytos*"]
